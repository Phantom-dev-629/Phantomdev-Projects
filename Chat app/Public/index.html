<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: min(100% - 2rem, 380px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h2 { font-size: 1.4rem; color: #111; }
    p  { font-size: .9rem; color: #666; }
    input {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    input.error  { border-color: #ef4444; }
    button {
      width: 100%;
      padding: .7rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4f46e5; }
    button:active { background: #4338ca; }
    .err-msg { font-size: .82rem; color: #ef4444; min-height: 1.1em; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <h2>Welcome to Chat</h2>
      <p>Choose a display name to get started.</p>
    </div>
    <div>
      <input id="name" type="text" placeholder="Your name" maxlength="32" autocomplete="off" autofocus>
      <div class="err-msg" id="err"></div>
    </div>
    <button id="joinBtn">Join Chat</button>
  </div>
  <script>
    const input   = document.getElementById("name");
    const errEl   = document.getElementById("err");
    const joinBtn = document.getElementById("joinBtn");

    function showError(msg) { errEl.textContent = msg; input.classList.add("error"); }
    function clearError()   { errEl.textContent = "";  input.classList.remove("error"); }

    function join() {
      const name = input.value.trim();
      if (!name) { showError("Please enter a display name."); input.focus(); return; }
      sessionStorage.setItem("chatName", name);
      window.location.href = "chat.html";
    }

    joinBtn.addEventListener("click", join);
    input.addEventListener("input", clearError);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
  </script>
</body>
</html>
